        :root {

            --bg-aqua: rgba(0, 157, 255, 0.1);

            --gold-accent: #ffcc00;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #023e8a;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            /* خلفية متدرجة تعطي إحساس أمواج البحر */
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* شريط تبديل اللغة */
        .top-bar {
            background: rgba(0, 119, 182, 0.1);
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .lang-btn {
            background: white;
            border: 2px solid var(--sea-blue);
            color: var(--sea-blue);
            padding: 5px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }
        .lang-btn:hover { background: var(--sea-blue); color: white; }

        header {
            text-align: center;
            padding: 50px 20px;
            background: rgba(255, 255, 255, 0.4);
            border-bottom: 4px solid var(--sea-blue);
            backdrop-filter: blur(10px);
        }
        header h1 { color: var(--sea-blue); margin: 0; font-size: 3.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        header p { font-weight: bold; color: #0077b6; }

        .container { max-width: 1200px; margin: auto; padding: 40px 20px; }
        .section-title { text-align: center; color: var(--sea-blue); margin-bottom: 40px; font-size: 2.2rem; }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 119, 182, 0.1);
            border-bottom: 5px solid var(--sea-blue);
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-10px); }

        .flag-wrapper {
            width: 85px; height: 85px; margin: 0 auto 15px;
            border-radius: 50%; overflow: hidden;
            border: 3px solid #caf0f8;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .flag { width: 100%; height: 100%; object-fit: cover; }

        .requirements { text-align: start; padding: 0; list-style: none; margin-top: 15px; }
        .requirements li { margin-bottom: 8px; font-size: 0.95rem; color: #333; display: flex; align-items: center; gap: 8px; }

        /* أيقونة واتساب عائمة */
        .whatsapp-float {
            position: fixed; bottom: 30px; right: 30px;
            background-color: #25d366; color: white;
            width: 65px; height: 65px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 1000; transition: 0.3s;
        }

        .flying-plane {
            position: fixed; top: 25%; left: -100px; font-size: 3rem;
            z-index: 2000; animation: infiniteFly 18s linear infinite;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
        }
        @keyframes infiniteFly {
            0% { left: -100px; transform: rotate(5deg); }
            100% { left: 110%; transform: rotate(-5deg); }
        }

        footer { text-align: center; padding: 40px; background: var(--sea-blue); color: white; margin-top: 60px; }
    </style>
</head>
