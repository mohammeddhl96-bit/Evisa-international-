<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElisaGroop | خدمات التأشيرة الإلكترونية</title>
    <style>
        :root {
            --primary-orange: #ff6600; /* برتقالي زاهي للسيف */
            --gold-color: #b38f00; /* ذهبي ملكي للشعار */
            --text-dark: #2a2a2a; /* أسود رمادي */
        }
        
        /* 1. تصميم الهيدر العلوي */
        header {
            background-color: rgba(255, 255, 255, 0.98);
            padding: 30px;
            text-align: center;
            border-bottom: 4px solid var(--gold-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        header h1 { 
            color: var(--gold-color); 
            margin: 0; 
            font-size: 3.5rem; /* شعار ElisaGroop */
            font-family: 'Arial Black', sans-serif;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* 2. تصميم الهيرو وخلفية الطائرة المثبتة */
        .hero {
            /* نفس صورة الطائرة في السماء */
            background-image: url('https://images.unsplash.com/photo-1517400508447-f8dd518b86db?q=80&w=1920&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* الخلفية مثبتة */
            background-repeat: no-repeat;
            padding: 80px 20px;
            text-align: center;
            position: relative;
        }
        
        /* طبقة حماية بيضاء شفافة فوق الهيرو */
        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.3);
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero h2 { 
            color: var(--primary-orange); 
            font-size: 2.8rem; 
            background-color: rgba(255, 255, 255, 0.85);
            display: inline-block;
            padding: 10px 30px;
            border-radius: 15px;
            border: 2px solid var(--gold-color);
            margin-bottom: 20px;
        }
        
        .hero p {
            background-color: rgba(255, 255, 255, 0.7);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--text-dark);
        }

        .btn-whatsapp {
            background: linear-gradient(45deg, #25d366, #128c7e);
            color: white;
            padding: 20px 50px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            margin-top: 35px;
            font-size: 1.5rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            border: 3px solid var(--gold-color);
            transition: 0.3s;
        }
        .btn-whatsapp:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.5);
        }

        .container { max-width: 1100px; margin: auto; padding: 40px 20px; }

        /* 3. تصميم معرض صور الطبيعة الأربعة (نفس المربعات) */
        .tourist-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 50px 0;
        }
        
        .gallery-item {
            height: 250px; /* مربعات أكبر */
            border-radius: 20px;
            background-size: cover;
            background-position: center;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }
        .gallery-item:hover { transform: scale(1.03); }

        .gallery-item span {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.5);
            color: #fff;
            text-align: center;
            padding: 10px 0;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .section-title {
            text-align: center;
            color: var(--gold-color);
            font-size: 2.3rem;
            margin-top: 60px;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        /* 4. تصميم شبكة كروت الدول */
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            padding: 30px;
            border-radius: 20px;
            border-top: 8px solid var(--primary-orange); /* فريم علوي أسمك */
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-8px); border-top-color: var(--gold-color); }

        .card h3 { color: var(--text-dark); margin: 0; font-size: 1.4rem; }
        .flag { width: 60px; border-radius: 6px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        /* 5. تصميم الفوتر */
        .footer { 
            text-align: center; 
            padding: 60px 20px; 
            background: rgba(255, 255, 255, 0.98); 
            border-top: 5px solid var(--gold-color);
            color: var(--gold-color);
            margin-top: 80px;
        }
    </style>
</head>
<body>

<header>
    <h1>ElisaGroop</h1>
</header>

<section class="hero">
    <div class="hero-content">
        <h2>تأشيرتك الإلكترونية في دقائق</h2>
        <p><b>ElisaGroop نعتني بتأشيرتك.. وأنت استمتع برحلتك</b></p>
        <br>
        <a href="https://wa.me/4917635315100" class="btn-whatsapp">تواصل معنا عبر واتساب</a>
    </div>
</section>

<div class="container">
    <h3 class="section-title">وجهات سياحية ساحرة</h3>
    <div class="tourist-gallery">
        <div class="gallery-item" style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80');"><span>أنهار وجبال</span></div>
        <div class="gallery-item" style="background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80');"><span>غابات طبيعية</span>
