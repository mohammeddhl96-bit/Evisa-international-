<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElisaGroop | خدمات الفيزا</title>
    <style>
        :root {
            --sea-blue: #0077b6;
            --light-aqua: #caf0f8;
            --gold-accent: #ffcc00;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(to bottom, #e0f2fe, #bae6fd);
            color: #023e8a;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* أزرار اللغة */
        .top-bar {
            padding: 15px;
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            background: rgba(255, 255, 255, 0.3);
        }
        .lang-btn {
            background: white; border: 2px solid var(--sea-blue);
            padding: 5px 15px; border-radius: 20px; cursor: pointer;
            font-weight: bold; color: var(--sea-blue);
        }

        header {
            text-align: center; padding: 40px 20px;
            background: white; border-bottom: 5px solid var(--sea-blue);
        }
        header h1 { font-size: 3rem; margin: 0; color: var(--sea-blue); }

        .container { max-width: 1200px; margin: auto; padding: 40px 20px; }
        .section-title { text-align: center; font-size: 2rem; margin-bottom: 40px; }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        /* تصميم كرت الدولة */
        .card {
            background: white; padding: 20px; border-radius: 15px;
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid var(--gold-accent);
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); }

        .flag-wrapper {
            width: 70px; height: 70px; margin: 0 auto 15px;
            border-radius: 50%; overflow: hidden; border: 2px solid #ddd;
        }
        .flag { width: 100%; height: 100%; object-fit: cover; }

        .requirements { text-align: right; padding: 0; list-style: none; font-size: 0.9rem; }
        .requirements li { margin-bottom: 5px; border-bottom: 1px solid #f0f0f0; }

        /* الطائرة */
        .flying-plane {
            position: fixed; top: 20%; left: -100px; font-size: 2.5rem;
            z-index: 2000; animation: fly 15s linear infinite;
        }
        @keyframes fly {
            from { left: -100px; }
            to { left: 110%; }
        }

        /* واتساب */
        .whatsapp-float {
            position: fixed; bottom: 30px; right: 30px;
            background: #25d366; width: 60px; height: 60px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000;
        }

        footer { text-align: center; padding: 30px; background: var(--sea-blue); color: white; margin-top: 50px; }
    </style>
</head>
<body>

<div class="top-bar">
    <button class="lang-btn" onclick="setLang('ar')">العربية</button>
    <button class="lang-btn" onclick="setLang('en')">English</button>
</div>

<div class="flying-plane">✈️</div>

<header>
    <h1 id="mainTitle">ElisaGroop</h1>
    <p id="subTitle">أسرع خدمات الفيزا والسياحة الدولية</p>
</header>

<div class="container">
    <h2 class="section-title" id="secTitle">متطلبات التأشيرة حسب الدولة</h2>
    <div class="services" id="servicesGrid">
        </div>
</div>

<a href="https://wa.me/4915561912961" class="whatsapp-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="35">
</a>

<footer id="footerText">© 2026 ElisaGroop - رحلتك تبدأ معنا</footer>

<script>
    const content = {
        ar: {
            sub: "أسرع خدمات الفيزا والسياحة الدولية",
            sec: "متطلبات التأشيرة حسب الدولة",
            foot: "© 2026 ElisaGroop - رحلتك تبدأ معنا",
            dir: "rtl",
            countries: [
                {n: "تركيا", f: "tr", r: ["جواز سفر ساري", "صورة شخصية", "تأشيرة إلكترونية"]},
                {n: "فرنسا", f: "fr", r: ["كشف حساب بنكي", "تأمين طبي", "إثبات عمل"]},
                {n: "بريطانيا", f: "gb", r: ["كشف حساب قوي", "ترجمة مستندات", "إثبات دخل"]},
                {n: "ألبانيا", f: "al", r: ["جواز سفر", "حجز طيران", "تأمين طبي"]},
                {n: "الجبل الأسود", f: "me", r: ["جواز سفر", "إثبات إقامة", "كشف حساب"]},
                {n: "أرمينيا", f: "am", r: ["صورة الجواز", "صورة شخصية", "تأشيرة"]},
                {n: "إستونيا", f: "ee", r: ["شنغن فيزا", "كشف حساب", "تأمين طبي"]},
                {n: "اليونان", f: "gr", r: ["كشف حساب", "حجز فندق", "تأمين سفر"]},
                {n: "جورجيا", f: "ge", r: ["جواز سفر", "تأمين دولي", "إقامة سارية"]},
                {n: "هولندا", f: "nl", r: ["متطلبات شنغن", "كشف حساب", "إثبات عمل"]}
            ]
        },
        en: {
            sub: "Fastest International Visa Services",
            sec: "Visa Requirements by Country",
            foot: "© 2026 ElisaGroop - Your Journey Starts Here",
            dir: "ltr",
            countries: [
                {n: "Turkey", f: "tr", r: ["Valid Passport", "Photo", "E-Visa"]},
                {n: "France", f: "fr", r: ["Bank Statement", "Insurance", "Job Proof"]},
                {n: "UK", f: "gb", r: ["Bank Statement", "Translations", "Income Proof"]},
                {n: "Albania", f: "al", r: ["Passport", "Flight Booking", "Insurance"]},
                {n: "Montenegro", f: "me", r: ["Passport", "Residency Proof", "Bank Stat."]},
                {n: "Armenia", f: "am", r: ["Passport Copy", "Photo", "Visa"]},
                {n: "Estonia", f: "ee", r: ["Schengen Visa", "Bank Stat.", "Insurance"]},
                {n: "Greece", f: "gr", r: ["Bank Statement", "Hotel", "Insurance"]},
                {n: "Georgia", f: "ge", r: ["Passport", "Insurance", "Residency"]},
                {n: "Netherlands", f: "nl", r: ["Schengen Req.", "Bank Stat.", "Job Proof"]}
            ]
        }
    };

    function setLang(l) {
        const d = content[l];
        document.getElementById('mainHtml').dir = d.dir;
        document.getElementById('subTitle').innerText = d.sub;
        document.getElementById('secTitle').innerText = d.sec;
        document.getElementById('footerText').innerText = d.foot;
        
        const grid = document.getElementById('servicesGrid');
        grid.innerHTML = '';
        d.countries.forEach(c => {
            grid.innerHTML += `
                <div class="card">
                    <div class="flag-wrapper"><img src="https://flagcdn.com/w160/${c.f}.png" class="flag"></div>
                    <h3>${c.n}</h3>
                    <ul class="requirements" style="text-align: ${l === 'ar' ? 'right' : 'left'}">
                        ${c.r.map(item => `<li>✅ ${item}</li>`).join('')}
                    </ul>
                </div>`;
        });
    }
    setLang('ar'); // تشغيل عند البداية
</script>
</body>
</html>
