<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElisaGroop | خدمات التأشيرة الإلكترونية</title>
    <style>
        :root {
            --primary-orange: #ff6600;
            --gold-color: #b38f00;
            --text-dark: #2a2a2a;
        }
        
        html {
            background-image: url('https://images.unsplash.com/photo-1517400508447-f8dd518b86db?q=80&w=1920&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: rgba(255, 255, 255, 0.4); 
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        header {
            background-color: rgba(255, 255, 255, 0.98);
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--gold-color);
            position: sticky; top: 0; z-index: 1000;
        }
        
        header h1 { color: var(--gold-color); margin: 0; font-size: 2.5rem; font-family: 'Arial Black'; }

        .hero { padding: 60px 20px; text-align: center; }
        .hero h2 { 
            color: var(--primary-orange); 
            background: rgba(255,255,255,0.9);
            padding: 10px 25px;
            border-radius: 15px;
            border: 2px solid var(--gold-color);
        }

        .container { max-width: 1100px; margin: auto; padding: 20px; }

        .section-title { text-align: center; color: var(--gold-color); font-size: 2rem; margin: 40px 0 20px; }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            border-top: 5px solid var(--primary-orange);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); }

        .flag-wrapper {
            width: 80px; height: 80px; margin: 0 auto 10px;
            border-radius: 50%; border: 3px solid var(--gold-color);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .flag { width: 100%; height: 100%; object-fit: cover; }

        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: white;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            text-align: center;
            box-shadow: 2px 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
        }

        footer { text-align: center; padding: 30px; background: white; border-top: 3px solid var(--gold-color); margin-top: 50px; }

        /* --- حركة الطائرة المستمرة --- */
        .flying-plane {
            position: fixed;
            top: 20%;
            left: -100px;
            font-size: 2.5rem;
            z-index: 2000;
            animation: infiniteFly 10s linear infinite; /* حركة لا نهائية */
            pointer-events: none; /* لكي لا تعيق النقر على الروابط */
        }

        @keyframes infiniteFly {
            0% { left: -100px; top: 20%; transform: rotate(10deg); }
            50% { top: 40%; transform: rotate(0deg); }
            100% { left: 110%; top: 20%; transform: rotate(-10deg); }
        }
    </style>
</head>
<body>

<div class="flying-plane">✈️</div>

<header>
    <h1>ElisaGroop</h1>
</header>

<section class="hero">
    <h2>خدمات الفيزا الإلكترونية بكل ثقة</h2>
    <p><b>أسرع طريق لوجهتك القادمة يبدأ من هنا</b></p>
</section>

<div class="container">
    
    <h3 class="section-title">وجهاتنا المتاحة</h3>
    <div class="services">
        <div class="card"><div class="flag-wrapper"><img src="https://flagcdn.com/w160/tr.png" class="flag"></div><h3>تركيا</h3></div>
        <div class="card"><div class="flag-wrapper"><img src="https://flagcdn.com/w160/al.png" class="flag"></div><h3>ألبانيا</h3></div>
        <div class="card"><div class="flag-wrapper"><img src="https://flagcdn.com/w160/me.png" class="flag"></div><h3>الجبل الأسود</h3></div>
        <div class="card"><div class="flag-wrapper"><img src="https://flagcdn.com/w160/am.png" class="flag"></div><h3>أرمينيا</h3></div>
        <div class="card"><div class="flag-wrapper"><img src="https://flagcdn.com/w160/ee.png" class="flag"></div><h3>استونيا</h3></div>
        <div class="card"><div class="flag-wrapper"><img src="https://flagcdn.com/w160/gr.png" class="flag"></div><h3>اليونان</h3></div>
        <div class="card"><div class="flag-wrapper"><img src="https://flagcdn.com/w160/ge.png" class="flag"></div><h3>جورجيا</h3></div>
        <div class="card"><div class="flag-wrapper"><img src="https://flagcdn.com/w160/fr.png" class="flag"></div><h3>فرنسا</h3></div>
        <div class="card"><div class="flag-wrapper"><img src="https://flagcdn.com/w160/nl.png" class="flag"></div><h3>هولندا</h3></div>
        <div class="card"><div class="flag-wrapper"><img src="https://flagcdn.com/w160/gb.png" class="flag"></div><h3>بريطانيا</h3></div>
    </div>

</div>

<a href="https://wa.me/4917635315100" class="whatsapp-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="40">
</a>

<footer>
    <p>© 2026 ElisaGroop - نفتح لك أبواب العالم</p>
</footer>

</body>
</html>
