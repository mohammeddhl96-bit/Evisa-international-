<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنجاز | خدمات التأشيرة الإلكترونية</title>
    <style>
        :root {
            --primary-color: #ff6600; /* برتقالي مشبع */
            --secondary-color: #1a1a1a; /* أسود مشبع */
            --text-light: #ffffff; /* أبيض */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--secondary-color);
            color: var(--text-light);
        }
        header {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
        }
        header h1 { color: var(--primary-color); margin: 0; }
        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1527672829631-02db9179f618?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            padding: 100px 20px;
            text-align: center;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
        }
        .container { max-width: 1100px; margin: auto; padding: 40px 20px; }
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            border-right: 5px solid var(--primary-color);
            transition: 0.3s;
        }
        .card h3 { display: flex; align-items: center; gap: 10px; color: var(--primary-color); }
        .flag { width: 25px; height: auto; border-radius: 2px; }
        .footer { text-align: center; padding: 40px; font-size: 0.8rem; opacity: 0.7; }
    </style>
</head>
<body>

<header>
    <h1>مكتب إنجاز لخدمات الفيزا</h1>
</header>

<section class="hero">
    <h2>تأشيرتك الإلكترونية في دقائق</h2>
    <p>نقدم خدماتنا لجميع الدول المذكورة أدناه بدقة واحترافية</p>
    <a href="https://wa.me/1633133243" class="btn-whatsapp">تواصل معنا عبر واتساب</a>
</section>

<div class="container">
    <div class="services">
        <div class="card"><h3><img src="https://flagcdn.com/w40/tr.png" class="flag"> تركيا</h3></div>
        <div class="card"><h3><img src="https://flagcdn.com/w40/al.png" class="flag"> ألبانيا</h3></div>
        <div class="card"><h3><img src="https://flagcdn.com/w40/me.png" class="flag"> الجبل الأسود</h3></div>
        <div class="card"><h3><img src="https://flagcdn.com/w40/am.png" class="flag"> أرمينيا</h3></div>
        <div class="card"><h3><img src="https://flagcdn.com/w40/ee.png" class="flag"> استونيا</h3></div>
        <div class="card"><h3><img src="https://flagcdn.com/w40/gr.png" class="flag"> اليونان</h3></div>
        <div class="card"><h3><img src="https://flagcdn.com/w40/ge.png" class="flag"> جورجيا</h3></div>
        <div class="card"><h3><img src="https://flagcdn.com/w40/fr.png" class="flag"> فرنسا</h3></div>
        <div class="card"><h3><img src="https://flagcdn.com/w40/eg.png" class="flag"> مصر</h3></div>
        <div class="card"><h3><img src="https://flagcdn.com/w40/nl.png" class="flag"> هولندا</h3></div>
        <div class="card"><h3><img src="https://flagcdn.com/w40/gb.png" class="flag"> بريطانيا</h3></div>
    </div>
</div>

<div class="footer">
    <p>© 2026 مكتب إنجاز لخدمات الفيزا - جميع الحقوق محفوظة</p>
</div>

</body>
</html>
