<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElisaGroop | Evisa</title>
    <style>
        :root {
            --sea-blue: #0077b6;
            --evisa-orange: #ff6600;
            --whatsapp-green: #25d366;
        }
        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f2fe; /* لون أزرق مائي */
            color: #023e8a;
        }
        header {
            text-align: center; padding: 40px 20px;
            background: white; border-bottom: 5px solid var(--sea-blue);
        }
        header h1 { font-size: 3.5rem; margin: 0; color: var(--sea-blue); }
        .evisa { font-size: 2.2rem; color: var(--evisa-orange); font-weight: bold; margin-top: 5px; }

        .container {
            display: flex; flex-wrap: wrap; width: 100%; max-width: 1200px; margin: auto;
        }
        .side {
            flex: 1; min-width: 320px; padding: 30px; box-sizing: border-box;
        }
        .side-ar { direction: rtl; border-left: 1px solid rgba(0,0,0,0.1); }
        .side-en { direction: ltr; background: rgba(255,255,255,0.2); }

        .card {
            background: white; margin-bottom: 15px; padding: 18px;
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex; align-items: center; gap: 15px;
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-3px); }
        .flag { width: 45px; height: 45px; border-radius: 50%; border: 1px solid #eee; object-fit: cover; }
        
        h2 { text-align: center; color: var(--sea-blue); margin-bottom: 30px; font-size: 1.8rem; }
        h3 { margin: 0; color: var(--sea-blue); font-size: 1.2rem; }
        p.req-text { margin: 5px 0 0 0; font-size: 0.95rem; color: #444; }

        footer {
            text-align: center; padding: 50px 20px; background: white;
            border-top: 3px solid var(--sea-blue); margin-top: 30px;
        }
        .contact-box {
            display: inline-flex; align-items: center; gap: 15px;
            background: #f0f9ff; padding: 15px 35px; border-radius: 50px;
            border: 2px solid var(--whatsapp-green); text-decoration: none;
            color: #333; font-size: 1.6rem; font-weight: bold; transition: 0.3s;
        }
        .contact-box:hover { background: var(--whatsapp-green); color: white; transform: scale(1.05); }
        .contact-box img { width: 35px; }

        .whatsapp-float {
            position: fixed; bottom: 30px; left: 30px;
            background: var(--whatsapp-green); width: 65px; height: 65px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 2000;
        }

        @media (max-width: 800px) {
            .dual-container { flex-direction: column; }
            .side { width: 100%; border: none; }
            header h1 { font-size: 2.5rem; }
            .contact-box { font-size: 1.3rem; }
        }
    </style>
</head>

</header>
